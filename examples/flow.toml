# Relative to this file's directory; use an absolute path under a supervisor.
state_dir = "./data"

[source]
connection_env = "FLOW_POSTGRES_URL"
id = "orders-primary-v1"
slot = "embrasure_flow"
publication = "embrasure_flow"
ack_mode = "materialized"
journal_durability = "local-disk"

[catalog]
uri = "http://localhost:8181"
# Optional REST authentication: name a process environment variable, not a secret.
# token_env = "FLOW_CATALOG_TOKEN"
# credential_env = "FLOW_CATALOG_CREDENTIAL" # client_id:client_secret for OAuth
# Additional PEM CA bundle for an https:// catalog signed by a private CA.
# tls_ca_file = "/etc/flow/catalog-ca.pem"
warehouse = "s3://warehouse/"
"s3.endpoint" = "http://localhost:9000"
"s3.region" = "us-east-1"
"s3.path-style-access" = "true"
# Use the standard storage credential chain or catalog-vended credentials.

[limits]
batch_rows = 1024
batch_bytes = 8388608
# Additional per-worker collapse retention; 0 forces the disk path.
collapse_memory_bytes = 134217728
# Fold a busy table's next epoch while the current one commits and applies,
# within the same collapse budget.
collapse_prefold = true
parquet_row_group_bytes = 33554432
# Rows per row group in compacted files and the initial copy; publication
# files keep 8192.
parquet_row_group_rows = 122880
# The largest single row change; a larger one blocks its table.
chunk_bytes = 4194304
# Queued lookahead descriptors shared by all tables. It only makes tables
# schedulable; a dispatched epoch reads further from the durable ledger.
pending_transactions = 256
# Optional cap on source transactions per publication epoch; unset by default.
# epoch_max_transactions = 10000
table_workers = 4
commits_per_second = 100
journal_bytes = 68719476736
spool_bytes = 34359738368
# Concurrently open source transactions, and savepoints with rows per transaction.
# spool_transactions = 1024
# spool_subtransactions = 1048576
wal_soft_bytes = 17179869184
wal_hard_bytes = 34359738368
# Time-travel window. Every retained snapshot enlarges the metadata file each commit rewrites.
snapshot_retention_secs = 3600
# Disable only when another process performs coordinated expiration; without it
# table metadata and files replaced by compaction are never reclaimed.
snapshot_expiration = true
# Never expire below this many snapshots on main.
snapshot_retain_last = 128
# Expire the oldest unprotected snapshots beyond this count, even inside the window.
snapshot_max_count = 1000
# Another writer's row changes hold that table's WAL this long; rolling them back
# within it resumes the table, afterwards only a resync recovers it.
# external_mutation_grace_secs = 900

[storage]
# Capture pauses below this much free space on the state volume (0 disables).
min_free_bytes = 4294967296
# Verify every row index checksum on each start, not only after an unclean exit.
verify_index_on_start = false
# "memory" declares a state_dir on tmpfs or ramfs; it requires [durability].
# See docs/operations.md#memory-backed-state.
medium = "disk"

[parquet_read]
footer_bytes = 8388608
row_group_fetch_bytes = 134217728
row_group_uncompressed_bytes = 268435456
batch_bytes = 134217728
# Maintenance scans fetch this many small input files whole, ahead of use,
# so object-store latency overlaps; 0 reads every file lazily by range.
# Deletion-vector reads use the same bounds for concurrent Puffin reads.
prefetch_files = 4
prefetch_file_bytes = 4194304

# Optional: local compaction thresholds, shown with their defaults. A soft limit
# schedules background maintenance; a hard limit pauses that table's publication
# until maintenance clears the debt.
# [compaction]
# "all", "l0-only", or "disabled"; delete-file compaction runs in every scope.
# data_rewrite_scope = "all"
# Uncompacted ingest output (L0): file count, total bytes and oldest file age.
# l0_soft_files = 6
# l0_hard_files = 32
# l0_soft_bytes = 134217728
# l0_hard_bytes = 268435456
# oldest_l0_soft_ms = 10000
# oldest_l0_hard_ms = 30000
# Files outside L0 smaller than l1_target_bytes, such as external rewrite output.
# stable_small_soft_files = 6
# stable_small_hard_files = 32
# Delete files that apply to any single data file.
# delete_files_soft = 8
# delete_files_hard = 16
# Rewrite a data file once this share of its rows is deleted.
# deleted_rows_percent = 30
# Pay delete-file count debt with a delete-only consolidation before any data
# rewrite; "current" restores the previous count-driven data rewrites. Format
# v3 tables always use "current".
# delete_debt = "consolidate"
# "per_target" makes delete consolidation and data-rewrite residuals write one
# position-delete file per full-size target data file, merging a target's
# files by size tier, and pooled ranges for L0 and smaller files, instead of
# shared files. Format v3 tables always use "shared".
# delete_layout = "shared"
# With "per_target", data files outside L0 of at least this size keep one
# delete file each; deletes on smaller and L0 files share range files.
# target_delete_min_file_bytes = 134217728
# With "per_target", once full-size data files keep this many single-target
# delete files table-wide and one keeps more than one, consolidation merges
# the smallest until at most half as many remain.
# target_delete_files_max = 16
# With "per_target", rewrite smaller data files outside L0 once this many
# single-target delete files apply to them table-wide.
# small_file_target_deletes = 8
# Bounds of one rewrite group and its applicable delete inputs.
# min_group_files = 2
# max_group_files = 32
# max_input_bytes = 1073741824
# max_delete_input_files = 32
# max_delete_input_bytes = 33554432
# max_delete_input_rows = 1000000
# Output file sizes for L0 -> L1 and L1 -> L2 rewrites.
# l1_target_bytes = 134217728
# l2_target_bytes = 536870912
# Files younger than this are not rewritten unless publication is paused.
# min_file_age_ms = 1000
# Data rewrites of keyed tables record one remap per input file instead of
# rewriting each moved row's index entry. See docs/local-compaction.md.
# lazy_index_remap = true
# Periodic maintenance materializes remaps while more retired files keep one,
# or a lookup may translate through more hops, rewriting at most
# remap_cleanup_rows index entries per visit.
# remap_max_files = 512
# remap_max_depth = 8
# remap_cleanup_rows = 32768

# Optional: replicate the journal and control state to object storage, so a
# worker and its whole state volume can be replaced without losing changes
# acknowledged to the source. Use a new prefix for each source incarnation.
# See docs/remote-durability.md.
# [durability]
# uri = "s3://warehouse-bucket/flow/orders-primary-v1"
# checkpoint_interval_secs = 30
# lease_secs = 10

# Optional HTTP probes and metrics: GET /healthz, /readyz and /metrics.
# Unauthenticated; bind to a private interface.
# [http]
# listen = "0.0.0.0:9464"
# /healthz fails after the running main loop stalls this long; 0 disables.
# liveness_timeout_secs = 300

# Generate these blocks with `embrasure-flow --config flow.toml discover`.
[[tables]]
source_namespace = "public"
source_table = "orders"
target_namespace = ["replicated"]
target_table = "orders"
# Use 3 for new v3 targets with deletion vectors; existing tables retain their format.
format_version = 2
primary_key = [0]
append_only = false
columns = [
  { field_id = 1, name = "id", data_type = "Int64", nullable = false },
  { field_id = 2, name = "status", data_type = "String", nullable = true },
]
