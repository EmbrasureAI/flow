services:
  postgres:
    image: postgres:18.6-bookworm
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=16", "-c", "max_wal_senders=16", "-c", "logical_decoding_work_mem=64kB"]
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: local-test-password
      POSTGRES_DB: flow
    ports: ["127.0.0.1:${FLOW_LOCAL_PG_PORT:-0}:5432"]
    healthcheck:
      # initdb's temporary server accepts Unix sockets before TCP is ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U flow -d flow"]
      interval: 2s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: demo-access
      MINIO_ROOT_PASSWORD: demo-secret-key
    ports: ["127.0.0.1:${FLOW_LOCAL_S3_PORT:-0}:9000"]
  bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://minio:9000 demo-access demo-secret-key; do sleep 1; done
        mc mb --ignore-existing local/warehouse
  rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: demo-access
      AWS_SECRET_ACCESS_KEY: demo-secret-key
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports: ["127.0.0.1:${FLOW_LOCAL_REST_PORT:-0}:8181"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/v1/config"]
      interval: 2s
      retries: 60
