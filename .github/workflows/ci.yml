name: Rust
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Keep the linked integration test binaries within hosted runner disk limits.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies from Ubuntu repositories
        run: |
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 (master); the toolchain input selects Rust
        with:
          toolchain: '1.97.1'
          components: rustfmt,clippy,rust-docs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
      - run: cargo test --locked --workspace --all-targets
        env:
          FLOW_V3_EXPORT: ${{ runner.temp }}/flow-v3-reader
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Independent Iceberg v3 reader
        run: uv run tests/local/v3_reader.py "$RUNNER_TEMP/flow-v3-reader"
      - name: Python fixture regressions
        run: >-
          uv run --with 'psycopg[binary]==3.3.5' --with 'duckdb==1.5.5'
          --with 'boto3==1.43.88' --with 'fastavro==1.12.2'
          python -m unittest discover -s tests/production -p 'test_*.py' -v
      - name: Reviewed distribution licenses
        run: |
          python3 -B -m unittest discover -s scripts -p test_license_policy.py -v
          cargo fetch --locked
          python3 -B scripts/package_licenses.py --target x86_64-unknown-linux-gnu --output "$RUNNER_TEMP/licenses-x86_64-linux"
          python3 -B scripts/package_licenses.py --target aarch64-unknown-linux-gnu --output "$RUNNER_TEMP/licenses-aarch64-linux"
      - run: cargo run --locked -p flow-daemon -- --config examples/flow.toml check
  jemalloc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies from Ubuntu repositories
        run: |
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 (master); the toolchain input selects Rust
        with:
          toolchain: '1.97.1'
          components: clippy,rust-docs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: jemalloc
      - run: cargo clippy --locked -p flow-daemon -p flow-state-store --all-targets --features flow-daemon/jemalloc --no-deps -- -D warnings
      - run: cargo test --locked -p flow-daemon -p flow-state-store --all-targets --features flow-daemon/jemalloc
      - name: Reviewed jemalloc distribution licenses
        run: |
          cargo fetch --locked
          python3 -B scripts/package_licenses.py --features jemalloc --target x86_64-unknown-linux-gnu --output "$RUNNER_TEMP/licenses-jemalloc-x86_64-linux"
          python3 -B scripts/package_licenses.py --features jemalloc --target aarch64-unknown-linux-gnu --output "$RUNNER_TEMP/licenses-jemalloc-aarch64-linux"
      - run: cargo run --locked -p flow-daemon --features jemalloc -- --config examples/flow.toml check
      - name: Verify process-wide allocator linkage
        run: |
          readelf --dyn-syms --wide target/debug/embrasure-flow > "$RUNNER_TEMP/flow-dynamic-symbols.txt"
          for symbol in malloc calloc realloc free; do
            if ! awk -v symbol="$symbol" '$7 != "UND" && $8 == symbol { found = 1 } END { exit !found }' "$RUNNER_TEMP/flow-dynamic-symbols.txt"; then
              echo "Missing defined dynamic allocator symbol: $symbol"
              exit 1
            fi
          done
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build dependencies from Ubuntu repositories
        run: |
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y clang libclang-dev cmake pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 (master); the toolchain input selects Rust
        with:
          toolchain: '1.94.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo +1.94.0 check --locked --workspace --all-targets --all-features
