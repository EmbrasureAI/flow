name: Audit
# Check Cargo.lock against the RustSec advisory database. Runs daily as well,
# since new advisories appear without any change to this repository.
# Justified exceptions live in .cargo/audit.toml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-audit@0.22.2
      # Invoke the binary directly: no Rust toolchain is needed to read Cargo.lock.
      - run: cargo-audit audit
