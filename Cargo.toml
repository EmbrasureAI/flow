[workspace]
members = ["crates/*"]
exclude = ["vendor/iceberg", "vendor/iceberg-catalog-rest", "vendor/iceberg-storage-opendal", "vendor/tokio-postgres"]
resolver = "2"

[patch.crates-io]
iceberg = { path = "vendor/iceberg" }
iceberg-catalog-rest = { path = "vendor/iceberg-catalog-rest" }
iceberg-storage-opendal = { path = "vendor/iceberg-storage-opendal" }

[patch."https://github.com/iambriccardo/rust-postgres"]
tokio-postgres = { path = "vendor/tokio-postgres" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/EmbrasureAI/flow"
publish = false

[workspace.dependencies]
flow-model = { path = "crates/model" }
flow-pg-source = { path = "crates/pg-source" }
flow-ingress-journal = { path = "crates/ingress-journal" }
flow-state-store = { path = "crates/state-store" }
flow-iceberg-ext = { path = "crates/iceberg-ext" }
flow-materializer = { path = "crates/materializer" }
flow-coordinator = { path = "crates/coordinator" }
flow-compactor = { path = "crates/compactor" }
flow-catalog-watch = { path = "crates/catalog-watch" }
arrow-array = "58"
arrow-schema = "60"
parquet = { version = "58", default-features = false, features = ["arrow", "arrow_canonical_extension_types", "async", "zstd", "snap"] }
iceberg = "=0.10.1"
iceberg-catalog-rest = "=0.10.1"
rocksdb = { version = "=0.24.0", default-features = false, features = ["lz4", "zstd", "multi-threaded-cf", "bindgen-runtime"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
bytes = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
blake3 = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tracing = "0.1"
metrics = "0.24"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tempfile = "3"
proptest = "1"
crc32fast = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1
strip = false

[profile.dev]
debug = 1
