[package]
name = "flow-state-store"
description = "Persistent ingestion state and row index for Embrasure Flow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
apply-profile = []
sst-profile = []
# Link RocksDB's jemalloc, which replaces malloc for the whole process on
# GNU/Linux as `flow-daemon/jemalloc` does, so benchmarks measure the
# production allocator.
jemalloc = ["rocksdb/jemalloc"]

[dependencies]
flow-model.workspace = true
metrics.workspace = true
rocksdb.workspace = true
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true
