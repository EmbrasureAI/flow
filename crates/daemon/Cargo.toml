[package]
name = "flow-daemon"
description = "Stream PostgreSQL changes into Apache Iceberg tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "embrasure-flow"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bincode.workspace = true
bytes.workspace = true
clap.workspace = true
flow-compactor.workspace = true
flow-coordinator.workspace = true
flow-iceberg-ext.workspace = true
flow-ingress-journal.workspace = true
flow-materializer.workspace = true
flow-model.workspace = true
flow-pg-source.workspace = true
flow-state-store.workspace = true
futures.workspace = true
iceberg.workspace = true
iceberg-catalog-rest = { workspace = true, features = ["metrics"] }
iceberg-storage-opendal = { version = "=0.10.1", default-features = false, features = ["opendal-fs", "opendal-s3"] }
metrics.workspace = true
metrics-exporter-prometheus = { version = "0.18", default-features = false }
native-tls = "0.2"
opendal = { version = "=0.57.0", default-features = false }
postgres-native-tls = { git = "https://github.com/iambriccardo/rust-postgres", rev = "c4b8de06aaa99f71800126bedcca6e623d368357" }
reqwest = { version = "0.12", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
typetag = "0.2"
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
