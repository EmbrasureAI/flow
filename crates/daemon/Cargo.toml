[package]
name = "flow-daemon"
description = "Stream PostgreSQL changes into Apache Iceberg tables"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "embrasure-flow"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
bytes.workspace = true
typetag = "0.2"
flow-model.workspace = true
flow-coordinator.workspace = true
flow-pg-source.workspace = true
flow-ingress-journal.workspace = true
flow-state-store.workspace = true
flow-materializer.workspace = true
iceberg.workspace = true
iceberg-catalog-rest = { workspace = true, features = ["metrics"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
clap.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
metrics.workspace = true
metrics-exporter-prometheus = { version = "0.18", default-features = false }
tracing-subscriber.workspace = true
reqwest = { version = "0.12", default-features = false }
opendal = { version = "=0.57.0", default-features = false }

[lints]
workspace = true

[dependencies.iceberg-storage-opendal]
version = "=0.10.1"
default-features = false
features = ["opendal-fs", "opendal-s3"]

[dependencies.postgres-native-tls]
git = "https://github.com/iambriccardo/rust-postgres"
rev = "c4b8de06aaa99f71800126bedcca6e623d368357"

[dependencies.native-tls]
version = "0.2"

[dependencies.futures]
workspace = true

[dependencies.uuid]
workspace = true

[dependencies.flow-compactor]
workspace = true

[dependencies.flow-iceberg-ext]
workspace = true

[dev-dependencies]
tempfile.workspace = true
