[package]
name = "flow-daemon"
description = "Stream PostgreSQL changes into Apache Iceberg tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "embrasure-flow"
path = "src/main.rs"

[features]
# GNU/Linux malloc interposition covers both Rust System and RocksDB C++.
jemalloc = ["dep:rocksdb", "rocksdb/jemalloc", "dep:tikv-jemalloc-ctl"]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
rocksdb = { workspace = true, optional = true }
tikv-jemalloc-ctl = { version = "=0.6.0", optional = true, features = ["stats", "use_std"] }

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bincode.workspace = true
bytes.workspace = true
clap.workspace = true
flow-compactor.workspace = true
flow-coordinator.workspace = true
flow-iceberg-ext.workspace = true
flow-ingress-journal.workspace = true
flow-materializer.workspace = true
flow-model.workspace = true
flow-pg-source.workspace = true
flow-state-store.workspace = true
futures.workspace = true
iceberg.workspace = true
iceberg-catalog-rest = { workspace = true, features = ["metrics"] }
iceberg-storage-opendal = { version = "=0.10.1", default-features = false, features = ["opendal-fs", "opendal-s3"] }
metrics.workspace = true
metrics-exporter-prometheus = { version = "0.18", default-features = false }
native-tls = "0.2"
opendal = { version = "=0.57.0", default-features = false }
postgres-native-tls = { git = "https://github.com/iambriccardo/rust-postgres", rev = "c4b8de06aaa99f71800126bedcca6e623d368357" }
# HTTPS catalogs: rustls with the platform trust store (SSL_CERT_FILE/SSL_CERT_DIR override it).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
rustls-native-certs = "0.8"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
typetag = "0.2"
uuid.workspace = true

[dev-dependencies]
base64 = "0.22"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
tempfile.workspace = true
time = { version = "0.3", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
